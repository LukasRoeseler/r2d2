name: Update OJS statistics

# Runs on a schedule and on demand. Writes statistics/statistics-YYYYMMDD.csv
# and commits it so the dashboard (index.html) picks up the newest file.
on:
  schedule:
    # 06:08 UTC daily = 08:08 CEST (summer). Note: in winter (CET, UTC+1)
    # this lands at 07:08 local. Off-the-hour to avoid GitHub's busy
    # scheduling windows, which can delay or drop on-the-hour jobs.
    - cron: "8 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write          # required so the job can push the new CSV

concurrency:
  group: ojs-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OJS statistics
        env:
          OJS_API_KEY: ${{ secrets.OJS_API_KEY }}
        run: python fetch_ojs_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add statistics/statistics-*.csv publications.json submissions.json submission_countries.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update statistics, publications, submissions, countries ($(date -u +%Y-%m-%d))"
            # Pull any manual edits made since checkout, then push, so a
            # country you edited on GitHub is never lost to a race.
            git pull --rebase --autostash origin main || true
            git push
          fi
